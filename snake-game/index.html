<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake Game</title>
<style>
  body{margin:0;background:#0f1a12;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
  canvas{background:#16261b;border:2px solid #2f6b44;border-radius:8px;max-width:95vw;touch-action:none}
  p{opacity:.7;margin:8px;text-align:center}
</style>
</head>
<body>
<h2 style="margin:6px">🐍 Snake</h2>
<canvas id="c" width="400" height="400"></canvas>
<p>Arrow keys / WASD or swipe to steer. Space to start &amp; restart. M = mute.</p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const N=20,S=c.width/N;
let snake,dir,next,food,score,over,started=false,speed,timer;
let best=+localStorage.getItem('snakeBest')||0,muted=false;

/* ---------- Sound (WebAudio, no files needed) ---------- */
let ac;
function tone(freq,dur,type='sine',vol=.15,slide=0,delay=0){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+delay;
    o.type=type;o.frequency.setValueAtTime(freq,t);
    if(slide)o.frequency.linearRampToValueAtTime(freq+slide,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur);
  }catch(e){}
}
const sfx={
  eat:()=>tone(500+Math.min(score,20)*25,.12,'triangle',.2,250),
  turn:()=>tone(180,.03,'square',.04),
  start:()=>{tone(440,.1,'square',.1);tone(660,.15,'square',.1,0,.1)},
  record:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.14,'triangle',.18,0,i*.09)),
  over:()=>[400,330,260,180].forEach((f,i)=>tone(f,.25,'sawtooth',.15,0,i*.16))
};

function reset(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};next=dir;score=0;over=false;speed=130;
  placeFood();schedule();
}
function placeFood(){
  do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}
  while(snake.some(s=>s.x===food.x&&s.y===food.y));
}
function schedule(){clearTimeout(timer);timer=setTimeout(tick,speed)}
function tick(){
  if(over)return;
  dir=next;
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){
    over=true;const rec=score>best;best=Math.max(best,score);
    if(rec&&score>0){sfx.over();setTimeout(sfx.record,700)}else sfx.over();
    try{localStorage.setItem('snakeBest',best)}catch(e){}
    draw();return;
  }
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){score++;sfx.eat();speed=Math.max(60,speed-3);placeFood()}
  else snake.pop();
  draw();schedule();
}
function turn(dx,dy){
  if(dx===-dir.x&&dy===-dir.y)return; // no reversing
  if(next.x!==dx||next.y!==dy)sfx.turn();
  next={x:dx,y:dy};
}
function start(){if(!started||over){started=true;reset();draw();sfx.start()}}
addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='m'||k==='M'){muted=!muted;return}
  if(k===' '){e.preventDefault();start();return}
  if(k==='ArrowUp'||k==='w')turn(0,-1);
  else if(k==='ArrowDown'||k==='s')turn(0,1);
  else if(k==='ArrowLeft'||k==='a')turn(-1,0);
  else if(k==='ArrowRight'||k==='d')turn(1,0);
  if(k.startsWith('Arrow'))e.preventDefault();
});
let t0;
c.addEventListener('touchstart',e=>{t0=e.touches[0];start()},{passive:true});
c.addEventListener('touchend',e=>{
  if(!t0)return;const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
  if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1);
});
c.addEventListener('click',start);

function draw(){
  x.clearRect(0,0,c.width,c.height);
  if(started){
    x.fillStyle='#ff5a5a';x.beginPath();x.arc(food.x*S+S/2,food.y*S+S/2,S/2-2,0,7);x.fill();
    snake.forEach((s,i)=>{x.fillStyle=i?'#4ade80':'#bbf7d0';x.fillRect(s.x*S+1,s.y*S+1,S-2,S-2)});
    x.fillStyle='#fff';x.font='16px system-ui';x.textAlign='left';
    x.fillText('Score '+score+'   Best '+best+(muted?'   🔇':''),8,20);
  }
  if(!started||over){
    x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,0,c.width,c.height);
    x.fillStyle='#fff';x.textAlign='center';
    x.font='32px system-ui';x.fillText(over?'Game Over':'Snake',c.width/2,c.height/2-10);
    x.font='16px system-ui';
    x.fillText(over?'Score '+score+' — press Space or click':'Press Space or click to start',c.width/2,c.height/2+22);
  }
}
draw();
</script>
</body>
</html>
